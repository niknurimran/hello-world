<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="config.js"></script>
    <script src="assets/lib/gm.js"></script>
    <style>
      @font-face { font-family: "Bebas Neue"; font-weight: 400; src: url("assets/fonts/BebasNeue-400.woff2") format("woff2"); }
      @font-face { font-family: "Anton"; font-weight: 400; src: url("assets/fonts/Anton-400.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 400; src: url("assets/fonts/Inter-400.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 500; src: url("assets/fonts/Inter-500.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 600; src: url("assets/fonts/Inter-600.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 700; src: url("assets/fonts/Inter-700.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 800; src: url("assets/fonts/Inter-800.woff2") format("woff2"); }
      :root {
        --bg: #0b0b0f; --panel: #14141b; --line: #26262f;
        --gold: #d4a73c; --gold-hi: #f4d27a; --green: #22c55e; --red: #ef4444; --white: #ffffff; --mute: #9a9aa8;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); font-family: "Inter", sans-serif; color: var(--white); }

      /* Shared scene styles */
      .disp { font-family: "Bebas Neue", "Anton", sans-serif; font-weight: 400; line-height: 0.92; letter-spacing: 0.01em; text-transform: uppercase; }
      .disp .w { display: inline-block; will-change: transform, filter; }
      .acc { color: var(--gold); }
      .acc-red { color: var(--red); }
      .ghost { position: absolute; pointer-events: none; mix-blend-mode: screen; }
      .gm-illus {
        position: absolute; font-family: "Inter", sans-serif; font-weight: 600; font-size: 30px; letter-spacing: 0.04em;
        color: rgba(255, 255, 255, 0.62); padding: 6px 14px; border: 1.5px solid rgba(255, 255, 255, 0.35); border-radius: 8px;
        background: rgba(11, 11, 15, 0.55);
      }
      .gm-chartcap { position: absolute; font-family: "Inter", sans-serif; font-weight: 700; font-size: 28px; color: rgba(255, 255, 255, 0.78); letter-spacing: 0.02em; }
      .gm-chartcap b { color: var(--gold); font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="goldmap" data-start="0" data-duration="36" data-width="1080" data-height="1920">
      <!-- HOSTS:BEGIN (generated by `npm run sync` from config.js) -->
      <div id="bg" class="clip" data-composition-id="bg" data-composition-src="compositions/bg.html" data-start="0" data-duration="36" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="hook" class="clip" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="3.2" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:5"></div>
      <div id="brand" class="clip" data-composition-id="brand" data-composition-src="compositions/brand.html" data-start="3.2" data-duration="3.2" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:5"></div>
      <div id="problem" class="clip" data-composition-id="problem" data-composition-src="compositions/problem.html" data-start="6.4" data-duration="4.8" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:5"></div>
      <div id="shift" class="clip" data-composition-id="shift" data-composition-src="compositions/shift.html" data-start="11.2" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:5"></div>
      <div id="demo" class="clip" data-composition-id="demo" data-composition-src="compositions/demo.html" data-start="15.2" data-duration="7.2" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:5"></div>
      <div id="how" class="clip" data-composition-id="how" data-composition-src="compositions/how.html" data-start="22.4" data-duration="7.2" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:5"></div>
      <div id="urgency" class="clip" data-composition-id="urgency" data-composition-src="compositions/urgency.html" data-start="29.6" data-duration="3.2" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:5"></div>
      <div id="cta" class="clip" data-composition-id="cta" data-composition-src="compositions/cta.html" data-start="32.8" data-duration="3.2" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:5"></div>
      <div id="risk" class="clip" data-composition-id="risk" data-composition-src="compositions/risk.html" data-start="29.6" data-duration="6.4" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:15"></div>
      <div id="fx" class="clip" data-composition-id="fx" data-composition-src="compositions/fx.html" data-start="0" data-duration="36" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:20"></div>
      <!-- HOSTS:END -->
      <!-- AUDIO:BEGIN (generated by `npm run sync` from config.js) -->

      <!-- AUDIO:END -->
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines.goldmap = tl;
    </script>
  </body>
</html>
