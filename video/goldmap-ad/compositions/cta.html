<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #cta-cam { position: absolute; inset: 0; }
    #cta-burst { position: absolute; left: 90px; top: 0px; width: 900px; height: 900px; border-radius: 50%;
      background: radial-gradient(circle, rgba(244,210,122,0.6) 0%, rgba(212,167,60,0.16) 36%, rgba(212,167,60,0) 68%); opacity: 0; }
    #cta-iconwrap { position: absolute; left: 430px; top: 280px; width: 220px; height: 220px; }
    #cta-word { position: absolute; left: 0; right: 0; top: 518px; text-align: center; font-size: 170px;
      background: linear-gradient(100deg, #8c6a1e 0%, #d4a73c 30%, #f4d27a 44%, #fff6d8 50%, #f4d27a 56%, #d4a73c 70%, #8c6a1e 100%);
      background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; }
    #cta-text { position: absolute; left: 40px; right: 40px; top: 730px; text-align: center; }
    #cta-text .ln { display: block; font-size: 132px; }
    #cta-url { position: absolute; left: 0; right: 0; top: 1000px; text-align: center; font-family: "Inter"; font-weight: 700; font-size: 40px; letter-spacing: 0.04em; color: var(--white); }
    #cta-arrows { position: absolute; left: 470px; top: 1080px; width: 140px; height: 260px; }
  </style>
  <div id="root" data-composition-id="cta" data-width="1080" data-height="1920">
    <div id="cta-cam">
      <div id="cta-burst"></div>
      <div id="cta-iconwrap"></div>
      <div id="cta-word" class="disp"></div>
      <div id="cta-text" class="disp"><span id="cta-l1" class="ln"></span><span id="cta-l2" class="ln acc"></span></div>
      <div id="cta-url"></div>
      <svg id="cta-arrows" viewBox="0 0 140 260">
        <path id="cta-a0" d="M20 20 L70 70 L120 20" fill="none" stroke="#D4A73C" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
        <path id="cta-a1" d="M20 100 L70 150 L120 100" fill="none" stroke="#D4A73C" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
        <path id="cta-a2" d="M20 180 L70 230 L120 180" fill="none" stroke="#F4D27A" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>
  </div>
  <script>
    (function () {
      const C = window.GM_CONFIG, GM = window.GM, T = C.text.cta;
      const S = GM.slot("cta"), B = S.lb;
      const tl = gsap.timeline({ paused: true });

      // Impact on beat 0: gold burst + logo.
      tl.fromTo("#cta-burst", { opacity: 1, scale: 0.3 }, { opacity: 0.35, scale: 1.3, duration: 0.9, ease: "expo.out" }, 0);
      const icon = GM.icon(document.getElementById("cta-iconwrap"), 220);
      tl.fromTo("#cta-iconwrap", { scale: 2.2, opacity: 0.3, filter: "blur(12px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "expo.out" }, 0);
      document.getElementById("cta-word").textContent = C.brand.wordmark;
      tl.fromTo("#cta-word", { clipPath: "inset(0% 50% 0% 50%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.3, ease: "expo.out" }, 0);
      tl.fromTo("#cta-word", { backgroundPosition: "100% 0%" }, { backgroundPosition: "0% 0%", duration: 1.2, ease: "power2.inOut" }, B(1));
      tl.to("#cta-word", { backgroundPosition: "100% 0%", duration: 1.2, ease: "power2.inOut" }, B(5));
      GM.shake(tl, "#cta-cam", 0, { amp: 16, dur: 0.24, seed: 81 });

      // CTA line on the beat.
      const w1 = GM.words(document.getElementById("cta-l1"), T.lines[0]);
      const w2 = GM.words(document.getElementById("cta-l2"), T.lines[1]);
      GM.slamLine(tl, document.getElementById("cta-l1"), w1, B(1), { from: 1.6 });
      GM.slamLine(tl, document.getElementById("cta-l2"), w2, B(1) + 0.28, { from: 1.6 });
      document.getElementById("cta-url").textContent = C.brand.url;
      tl.fromTo("#cta-url", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2 }, B(2));

      // Arrows cascade down toward the "See details" button, all the way to the end.
      const n = Math.floor((S.dur - B(2)) / 0.4);
      ["#cta-a0", "#cta-a1", "#cta-a2"].forEach((id, k) => {
        tl.fromTo(id, { opacity: 0.15, y: -10 }, { opacity: 1, y: 10, duration: 0.2, yoyo: true, repeat: Math.max(0, 2 * n - 1), ease: "sine.inOut" }, B(2) + k * 0.1);
      });
      tl.fromTo("#cta-arrows", { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "expo.out" }, B(2));


      window.__timelines["cta"] = tl;
    })();
  </script>
</template>
